name: Supabase keep-alive

# Free-tier Supabase projects pause after ~7 days of inactivity.
# This pings the REST API twice a week to keep the project active.
on:
  schedule:
    - cron: "30 3 * * 1,4"   # Mon & Thu, 03:30 UTC (09:00 IST)
  workflow_dispatch: {}       # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY repo secret"; exit 1
          fi
          # Real DB query (RLS may return [], which is fine -- a 200 is all we need)
          status=$(curl -sS -m 30 --retry 3 --retry-delay 5 --retry-all-errors -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL%/}/rest/v1/holdings?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase responded with HTTP ${status}"
          [ "$status" -ge 200 ] && [ "$status" -lt 300 ]

  app-health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check app health endpoint
        run: |
          set -euo pipefail
          status=$(curl -sS -m 60 --retry 3 --retry-delay 10 --retry-all-errors \
            -o /dev/null -w "%{http_code}" https://wealthlens.pro/health)
          echo "App /health responded with HTTP ${status}"
          [ "$status" -ge 200 ] && [ "$status" -lt 300 ]
