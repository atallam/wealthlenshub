name: Supabase keep-alive

# Free-tier Supabase projects pause after ~7 days of inactivity.
# This pings the REST API twice a week to keep the project active.
on:
  schedule:
    - cron: "30 3 * * 1,4"   # Mon & Thu, 03:30 UTC (09:00 IST)
  workflow_dispatch: {}       # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY repo secret"; exit 1
          fi
          # Calls the public.keepalive() RPC (migrations/keepalive_migration.sql).
          # holdings is not readable by the anon role, so don't query it here.
          # Legacy anon keys are JWTs (eyJ...); new-style keys must skip Authorization.
          auth=()
          case "$SUPABASE_ANON_KEY" in
            eyJ*) auth=(-H "Authorization: Bearer ${SUPABASE_ANON_KEY}") ;;
          esac
          status=$(curl -sS -m 30 --retry 3 --retry-delay 5 --retry-all-errors \
            -X POST -o /tmp/body.txt -w "%{http_code}" \
            "${SUPABASE_URL%/}/rest/v1/rpc/keepalive" \
            -H "apikey: ${SUPABASE_ANON_KEY}" -H "Content-Type: application/json" \
            -d '{}' "${auth[@]}")
          if [ "$status" -ge 300 ]; then echo "Response body: $(head -c 300 /tmp/body.txt)"; fi
          echo "Supabase responded with HTTP ${status}"
          [ "$status" -ge 200 ] && [ "$status" -lt 300 ]

  app-health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check app health endpoint
        run: |
          set -euo pipefail
          status=$(curl -sS -m 60 --retry 3 --retry-delay 10 --retry-all-errors \
            -o /dev/null -w "%{http_code}" https://wealthlens.pro/health)
          echo "App /health responded with HTTP ${status}"
          [ "$status" -ge 200 ] && [ "$status" -lt 300 ]
