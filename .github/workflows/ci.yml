name: CI

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install JS dependencies
        run: npm ci --ignore-scripts
      - name: Install CAS parser (pinned, same as production)
        run: pip install casparser==1.4.1 casparser-isin pymupdf
      - name: Lint (warnings fail the build)
        run: npx eslint . --max-warnings 0
      - name: File size check (warn-only)
        run: node scripts/check-file-size.mjs
      - name: Build (same command Render runs)
        run: npx vite build
      - name: Dependency audit (non-blocking - surfaces new advisories)
        run: npm audit --omit=dev --audit-level=critical
        continue-on-error: true
      - name: JS tests
        run: npx vitest run
      - name: Python tests
        run: python3 tests/test_cas_casparser_service.py
