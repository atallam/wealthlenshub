services:
  - type: web
    name: wealthlens-hub
    runtime: node
    region: singapore
    buildCommand: pip install casparser casparser-isin pymupdf --break-system-packages --quiet && npm install --include=dev && npx vite build
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      # Supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # Anthropic
      - key: ANTHROPIC_KEY
        sync: false
      # Encryption
      - key: BUDGET_ENCRYPT_KEY
        sync: false
      - key: ENCRYPT_KEY
        sync: false
      # Cron
      - key: CRON_SECRET
        sync: false
      # SnapTrade
      - key: SNAPTRADE_CLIENT_ID
        sync: false
      - key: SNAPTRADE_CONSUMER_KEY
        sync: false
      # Plaid
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_ENV
        value: sandbox
      # Gmail / Google OAuth
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REDIRECT_URI
        sync: false
      # Setu (optional — set SETU_ENABLED=true to activate)
      - key: SETU_ENABLED
        value: "false"
      - key: SETU_CLIENT_ID
        sync: false
      - key: SETU_CLIENT_SECRET
        sync: false
      - key: SETU_BASE_URL
        sync: false

  - type: cron
    name: wealthlens-hub-price-cron
    runtime: node
    region: singapore
    # 8:00 AM IST = 02:30 UTC — runs every day including weekends
    schedule: "30 2 * * *"
    buildCommand: echo "no build"
    startCommand: >
      node -e "
        const h={method:'POST',headers:{'x-cron-secret':process.env.CRON_SECRET,'Content-Type':'application/json'}};
        const base='https://wealthlens.pro';
        async function run(){
          try{
            const p=await fetch(base+'/api/cron/refresh-all-prices',h);
            console.log('prices',JSON.stringify(await p.json()));
          }catch(e){console.error('prices error',e.message);}
          try{
            const s=await fetch(base+'/api/cron/nudge-stale',h);
            console.log('nudge',JSON.stringify(await s.json()));
          }catch(e){console.error('nudge error',e.message);}
          try{
            const f=await fetch(base+'/api/cron/fd-alerts',h);
            console.log('fd-alerts',JSON.stringify(await f.json()));
          }catch(e){console.error('fd-alerts error',e.message);}
          try{
            const a=await fetch(base+'/api/cron/alert-check',h);
            console.log('alert-check',JSON.stringify(await a.json()));
          }catch(e){console.error('alert-check error',e.message);}
          try{
            const i=await fetch(base+'/api/cron/insurance-reminders',h);
            console.log('insurance-reminders',JSON.stringify(await i.json()));
          }catch(e){console.error('insurance-reminders error',e.message);}
          try{
            const g=await fetch(base+'/api/cron/goal-milestones',h);
            console.log('goal-milestones',JSON.stringify(await g.json()));
          }catch(e){console.error('goal-milestones error',e.message);}
        }
        run();
      "
    envVars:
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: wealthlens-hub-cas-email-cron
    runtime: node
    region: singapore
    # 8:00 AM IST Sunday = 02:30 UTC Sunday — weekly CAS file check
    schedule: "30 2 * * 0"
    buildCommand: echo "no build"
    startCommand: >
      node -e "
        async function run(){
          try{
            const r=await fetch('https://wealthlens.pro/api/cron/check-cas-email',{method:'POST',headers:{'x-cron-secret':process.env.CRON_SECRET,'Content-Type':'application/json'}});
            const d=await r.json();
            console.log('cas-email',JSON.stringify(d));
            if(!r.ok) process.exit(1);
          }catch(e){console.error('cas error',e.message);process.exit(1);}
        }
        run();
      "
    envVars:
      - key: CRON_SECRET
        sync: false
